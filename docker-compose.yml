version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: synthetic_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  streamlit_app:
    build: .
    container_name: genai_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/app/gcp-key.json:ro
    depends_on:
      - postgres

volumes:
  pgdata: